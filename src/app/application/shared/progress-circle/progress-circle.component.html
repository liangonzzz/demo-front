<div class="progress-container">
  <h3>{{ title }}</h3>
  <div class="circle-progress">
    <svg viewBox="0 0 36 36">
      <!-- Círculo de fondo -->
      <circle cx="18" cy="18" r="12" class="circle-background" />
      <!-- Círculo de fondo del progreso -->
      <path class="circle-bg"
        d="M18 2.0845
          a 15.9155 15.9155 0 0 1 0 31.831
          a 15.9155 15.9155 0 0 1 0 -31.831"/>
      <!-- Círculo de progreso -->
      <path class="circle-fill"
        [attr.stroke-dasharray]="progress + ', 100'"
        d="M18 2.0845
          a 15.9155 15.9155 0 0 1 0 31.831
          a 15.9155 15.9155 0 0 1 0 -31.831"/>
      <!-- Texto del porcentaje y etiqueta -->
      <text x="18" y="18" class="percentage">{{ progress }}%</text>
      <text x="18" y="23" class="label">Completado</text>
    </svg>
  </div>
</div>
