<div class="login-container">
  <!-- Sección de la imagen -->
  <div class="image-section">
    <div class="overlay"></div>
  </div>

  <!-- Sección del logo -->
  <div class="logo-section">
    <img [src]="dataLogo" alt="Logo" class="logo">
    <img [src]="imgGrhLogo" alt="marca" class="marca">
  </div>

  <!-- Sección del formulario -->
  <div class="form-section">
    <h2>Restablecer contraseña</h2>
    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      <!-- Campo de nueva contraseña -->
      <div class="p-field">
        <label for="newPassword"> Nueva contraseña</label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined">lock</span>
          <input pInputText id="newPassword" [type]="showPassword ? 'text' : 'password'" placeholder="Ingrese su nueva contraseña"
            formControlName="newPassword"  />
          <i class="pi" [ngClass]="showPassword ? 'pi-eye-slash' : 'pi-eye'" (click)="togglePasswordVisibility('password')"></i>
        </div>
        <small class="resetpass">
          <div class="password-requirements">
            <span [ngClass]="{'valid': hasMinLength}"><i class="pi pi-check"></i> Mín. 8 caracteres</span>
            <span [ngClass]="{'valid': hasUppercase}"><i class="pi pi-check"></i> Mayúscula</span>
            <span [ngClass]="{'valid': hasLowercase}"><i class="pi pi-check"></i> Minúscula</span>
            <span [ngClass]="{'valid': hasNumber}"><i class="pi pi-check"></i> Número</span>
          </div>
        </small>
      </div>

      <!-- Campo de confirmación de contraseña -->
      <div class="p-field">
        <label for="confirmPassword"> Confirmar contraseña</label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined">lock</span>
          <input pInputText id="confirmPassword" [type]="showConfirmPassword ? 'text' : 'password'" placeholder="Confirme su nueva contraseña"
            formControlName="confirmPassword" />
          <i class="pi" [ngClass]="showConfirmPassword ? 'pi-eye-slash' : 'pi-eye'" (click)="togglePasswordVisibility('confirmPassword')"></i>
        </div>
      </div>

      <!-- Mensaje de error -->
      <div *ngIf="showError" class="error-container">
        <p class="error-text">{{ errorMessage }}</p>
      </div>

      <!-- Botón de enviar -->
      <app-button etiqueta="Restablecer Contraseña" tipo="submit"></app-button>

      <!-- Enlace para regresar al login -->
      <div class="return-home">
        <a (click)="navigateToLoginRestablecer()">
          <i class="pi pi-arrow-left"></i> Vuelve a la pantalla de Inicio de Sesión
        </a>
      </div>
    </form>
  </div>
</div>
