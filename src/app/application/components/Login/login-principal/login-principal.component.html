<div class="login-container">
  <!-- Sección de la imagen (Cuadro Rojo) -->
  <div class="image-section">
    <div class="overlay"></div>
  </div>

  <!-- Sección del logo (Cuadro Azul) -->

  <div class="logo-section">
    <img [src]="dataLogo" alt="Logo" class="logo">
    <img [src]="imgGrhLogo" alt="marca" class="marca">
  </div>

  <!-- Sección del formulario (Cuadro Verde) -->
  <div class="form-section">
    <h2>Bienvenido</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="p-field">
        <label for="documentNumber">Número de usuario</label>
        <div class="input-wrapper">
          <i class="pi pi-user"></i>
          <input pInputText id="documentNumber" type="number" placeholder="Ingrese su número de identificación"
            formControlName="documentNumber" appNotificadorErrorInput />
        </div>
      </div>


      <div class="p-field">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined">lock</span>
          <input pInputText id="password" formControlName="password" type="password" placeholder="Ingrese su contraseña"
          appNotificadorErrorInput />
        </div>
      </div>

      <div class="checkbox-container">
        <div class="checkbox-item">
          <input type="checkbox" id="politica-seguridad" class="custom-checkbox">
          <label for="politica-seguridad"></label>
          <a href="https://sucursal.pagatodo.com.co/#tycWeb" target="_blank">Acepto la política de seguridad de la información.</a>
        </div>

        <div class="checkbox-item">
          <input type="checkbox" id="datos-personales" class="custom-checkbox">
          <label for="datos-personales"></label>
          <a href="https://sucursal.pagatodo.com.co/#portafolioLegalWeb" target="_blank">Acepto la política de tratamiento de datos personales.</a>
        </div>

        <div class="checkbox-item">
          <input type="checkbox" id="canal-digital" class="custom-checkbox">
          <label for="canal-digital"></label>
          <a href="https://sucursal.pagatodo.com.co/#tratamientoDatosWeb" target="_blank">Conozco y acepto el portafolio actual habilitado para el canal digital.</a>
        </div>
      </div>



      <!-- Botón de enviar -->
      <app-button etiqueta="Iniciar Sesión" tipo="submit"></app-button>



      <!-- Enlace de "Olvidaste tu contraseña" -->
      <div class="forgot-password">
        <a (click)="navigateToLoginRestablecer()">¿Olvido su contraseña?</a>
      </div>
    </form>
  </div>
</div>
