<div class="login-container">
  <!-- Sección de la imagen (Cuadro Rojo) -->
  <div class="image-section">
    <div class="overlay"></div>
  </div>

  <!-- Sección del logo (Cuadro Azul) -->
  <div class="logo-section">
    <img [src]="dataLogo" alt="Logo" class="logo">
    <img [src]="imgGrhLogo" alt="marca" class="marca">
  </div>

  <!-- Sección del formulario (Cuadro Verde) -->
  <div class="form-section">
    <h2>Bienvenido</h2>
    <form *ngIf="loginForm" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="p-field">
        <label for="documentNumber">Número de usuario</label>
        <div>
          <i class="pi pi-user"></i>
          <input
            pInputText
            id="documentNumber"
            type="number"
            placeholder="Ingrese su número de identificación"
            formControlName="documentNumber"
            appNotificadorErrorInput
          />
        </div>
      </div>

      <div class="p-field">
        <label for="password">Contraseña</label>
        <div class="password-input-container">
          <span class="material-symbols-outlined">lock</span>
          <input
            pInputText
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Ingrese su contraseña"
            appNotificadorErrorInput
          />
          <span
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [class.visible]="showPassword">
            <i class="pi" [ngClass]="showPassword ? 'pi-eye-slash' : 'pi-eye'"></i>
          </span>
        </div>
      </div>

      <!-- Contenedor de mensaje de error -->
      <div class="error-container" [ngClass]="{'show': showError}">
        <p class="error-text" *ngIf="showError">{{ errorMessage }}</p>
      </div>

      <div class="checkbox-container">
        <div class="checkbox-item">
          <input
            type="checkbox"
            id="politica-seguridad"
            class="custom-checkbox"
            formControlName="politicaSeguridad">
          <label for="politica-seguridad"></label>
          <a href="URL_POLITICA_SEGURIDAD" target="_blank">Acepto la política de seguridad de la información.</a>
        </div>

        <div class="checkbox-item">
          <input
            type="checkbox"
            id="datos-personales"
            class="custom-checkbox"
            formControlName="datosPersonales">
          <label for="datos-personales"></label>
          <a href="URL_DATOS_PERSONALES" target="_blank">Acepto la política de tratamiento de datos personales.</a>
        </div>

        <div class="checkbox-item">
          <input
            type="checkbox"
            id="canal-digital"
            class="custom-checkbox"
            formControlName="canalDigital">
          <label for="canal-digital"></label>
          <a href="https://www.youtube.com/watch?v=H58vbez_m4E" target="_blank">Conozco y acepto el portafolio actual habilitado para el canal digital.</a>
        </div>
      </div>

      <!-- Botón de enviar -->
      <app-button etiqueta="Iniciar Sesión" tipo="submit"></app-button>

      <!-- Enlace de "Olvidaste tu contraseña" -->
      <div class="forgot-password">
        <a (click)="navigateToLoginRestablecer()">¿Olvido su contraseña?</a>
      </div>
    </form>
  </div>
</div>
